<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overload Log</title>
<meta name="description" content="One movement pattern a day: guided warm-up, ramp-up sets and 5 to 7 rep work sets, with progress tracking.">
<meta name="theme-color" content="#EDEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .backup { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
  .confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border: 1.5px dashed var(--ink); border-radius: 10px; font-size: 14px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one column with two tabs. Train shows one focus lift per movement pattern, each pattern marked with an IPF-colour plate. Progress charts working weight and reps against the 5 to 7 rep band. */
  :root {
    --bg: #EDEFF1;
    --surface: #F8F9FA;
    --sunken: #E1E5E8;
    --line: #CDD3D8;
    --line-strong: #8A939F;
    --ink: #171B21;
    --ink-2: #434B56;
    --ink-3: #5C6571;
    --action: #171B21;
    --on-action: #F8F9FA;
    --edge: #2C323B;
    --plate-red: #C42F29;
    --plate-blue: #2B5DBD;
    --plate-yellow: #D9A200;
    --plate-green: #2B8755;
    --plate-white: #F4F5F6;
    --plate-black: #3B4048;
    --font-display: 'Big Shoulders Display', 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
    --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101318;
      --surface: #181C22;
      --sunken: #0C0E12;
      --line: #2A3039;
      --line-strong: #6E7783;
      --ink: #E9ECEF;
      --ink-2: #B3BAC4;
      --ink-3: #8F98A5;
      --action: #E9ECEF;
      --on-action: #101318;
      --edge: #9AA3AF;
      --plate-red: #E5584F;
      --plate-blue: #6C97F0;
      --plate-yellow: #EDBF35;
      --plate-green: #52B781;
      --plate-white: #E8EBEE;
      --plate-black: #59606B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101318;
    --surface: #181C22;
    --sunken: #0C0E12;
    --line: #2A3039;
    --line-strong: #6E7783;
    --ink: #E9ECEF;
    --ink-2: #B3BAC4;
    --ink-3: #8F98A5;
    --action: #E9ECEF;
    --on-action: #101318;
    --edge: #9AA3AF;
    --plate-red: #E5584F;
    --plate-blue: #6C97F0;
    --plate-yellow: #EDBF35;
    --plate-green: #52B781;
    --plate-white: #E8EBEE;
    --plate-black: #59606B;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 20px 56px;
  }
  button, input { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  h1 { margin: 0; font: 800 30px/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; }
  .seg { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: 0; padding: 7px 16px; min-height: 38px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--action); color: var(--on-action); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: -8px; }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 12px 16px; min-height: 46px; font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  .view { display: flex; flex-direction: column; gap: 30px; min-width: 0; }
  .intro { display: flex; flex-direction: column; gap: 14px; }
  .intro p { margin: 0; max-width: 62ch; color: var(--ink-2); }
  .intro .note { color: var(--ink-3); font-size: 13px; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px 32px; padding-block: 14px; border-block: 1px solid var(--line); }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat b { font: 800 34px/1 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

  .disc { width: 30px; height: 30px; flex: none; }
  .disc .d1 { fill: var(--pc); stroke: var(--edge); stroke-width: 1.5; }
  .disc .d2 { fill: none; stroke: var(--edge); stroke-opacity: .4; stroke-width: 1; }
  .disc .d3 { fill: var(--bg); stroke: var(--edge); stroke-width: 1.5; }

  .pat { display: flex; flex-direction: column; gap: 6px; }
  .phead { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; }
  .ptxt { flex: 1; min-width: 0; }
  .ptxt h2 { margin: 0; font: 700 24px/1.05 var(--font-display); letter-spacing: .06em; text-transform: uppercase; text-wrap: balance; }
  .ptxt p { margin: 2px 0 0; font-size: 13px; color: var(--ink-3); }
  .pe { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .pe b { font: 800 24px/1 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .pe span { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

  .lifts { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); }
  .lifts > li { border-top: 1px solid var(--line); }
  .lifts > li.open { background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 12px; margin-block: 8px; }

  .row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: transparent; border: 0; padding: 13px 4px; min-height: 66px; cursor: pointer; }
  .open .row { padding-inline: 16px; }
  .nm { display: flex; flex-direction: column; min-width: 0; }
  .n1 { font-weight: 600; font-size: 16px; }
  .n2 { font-size: 13px; color: var(--ink-3); }
  .tg { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .tgv { font: 800 32px/1 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .tgv small { font: 600 12px var(--font-body); color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
  .chip { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
  .chip.up { background: var(--action); border-color: var(--action); color: var(--on-action); }
  .chip.down, .chip.plat { border-style: dashed; border-color: var(--ink); color: var(--ink); }
  .chip.new { border-color: var(--line); color: var(--ink-3); }

  .panel { display: flex; flex-direction: column; gap: 20px; padding: 6px 16px 18px; }
  .big { display: flex; align-items: baseline; gap: 8px 10px; flex-wrap: wrap; }
  .bn { font: 800 clamp(56px, 17vw, 80px)/.9 var(--font-display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .bu { font-weight: 600; font-size: 18px; color: var(--ink-2); }
  .bs { font-size: 15px; color: var(--ink-2); }
  .plates { margin: 0; font: 400 13px/1.4 var(--font-mono); background: var(--sunken); color: var(--ink-2); padding: 9px 12px; border-radius: 8px; }
  .plat-note { margin: 0; padding: 12px 14px; border: 1.5px dashed var(--ink); border-radius: 10px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .plat-note b { font-weight: 700; }

  .sets { display: flex; flex-wrap: wrap; gap: 10px; }
  .setb { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent; color: var(--ink-3); font: 800 24px/1 var(--font-display); cursor: pointer; font-variant-numeric: tabular-nums; }
  .setb.hit { background: var(--action); border-color: var(--action); color: var(--on-action); }
  .setb.mid { background: var(--surface); border: 2.5px solid var(--ink); color: var(--ink); }
  .setb.miss { background: var(--bg); border: 2px dashed var(--ink); color: var(--ink); }
  .hint { margin: 0; font-size: 13px; color: var(--ink-3); max-width: 56ch; }
  .tip { margin: 0; font-size: 14px; color: var(--ink-2); max-width: 56ch; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { background: var(--action); color: var(--on-action); border: 1.5px solid var(--action); border-radius: 8px; min-height: 46px; padding: 0 20px; font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn.small { min-height: 38px; padding: 0 14px; font-size: 13px; }
  .btn:disabled { opacity: .38; cursor: not-allowed; }

  .blk { display: flex; flex-direction: column; gap: 8px; }
  .lbl { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .empty { margin: 0; font-size: 13px; color: var(--ink-3); }
  .key { font-size: 12px; color: var(--ink-3); margin: 0; max-width: 60ch; }

  .chart { width: 100%; height: auto; display: block; max-width: 100%; }
  .chart .band { fill: var(--sunken); }
  .chart .ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .chart .ln.focus { stroke: var(--ink); stroke-width: 2.4; }
  .chart .ln.other { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .chart .gl { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .dot { fill: var(--ink); stroke: var(--ink); stroke-width: 1.5; }
  .chart .miss { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
  .chart .pr { fill: var(--pc); stroke: var(--ink); stroke-width: 2; }
  .chart .tx { fill: var(--ink-3); font: 11px var(--font-mono); }
  .chart .tv { fill: var(--ink); font: 500 12px var(--font-mono); }

  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .legend li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .legend .lv { font: 500 12px var(--font-mono); color: var(--ink-2); }
  .sw { width: 28px; height: 8px; }
  .sw line { stroke-linecap: round; }
  .sw .f { stroke: var(--ink); stroke-width: 2.5; }
  .sw .o { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 3; }

  .sess { list-style: none; margin: 0; padding: 0; font: 400 13px/1.3 var(--font-mono); }
  .sess li { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; padding-block: 7px; border-top: 1px solid var(--line); }
  .sess li:first-child { border-top: 0; }
  .sess .ok { color: var(--ink); }
  .sess .no { color: var(--ink-3); }
  .nt { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 2px; font: 400 13px/1.4 var(--font-body); color: var(--ink-2); }
  .nt b { font-weight: 600; color: var(--ink); }
  .lastnotes { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-left: 3px solid var(--line-strong); background: var(--sunken); border-radius: 0 8px 8px 0; }
  .exnote { display: block; width: 100%; min-height: 64px; padding: 10px 12px; font: 400 16px/1.4 var(--font-body); background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 8px; resize: vertical; margin-top: -4px; }
  .link { align-self: flex-start; background: none; border: 0; padding: 6px 0; min-height: 36px; font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--ink); }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
  .fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .fld label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .fld input { width: 100%; min-height: 42px; padding: 8px 10px; font: 500 15px var(--font-mono); background: var(--bg); border: 1.5px solid var(--line-strong); border-radius: 8px; }

  .swap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .opt { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; padding: 10px 12px; min-height: 52px; background: transparent; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; }
  .opt[aria-pressed="true"] { border-color: var(--ink); background: var(--bg); }
  .opt .o1 { font-weight: 600; }
  .opt .o2 { font-size: 12px; color: var(--ink-3); }

  .pgctl { display: flex; justify-content: flex-end; margin-bottom: -18px; }
  .pgrid { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); }
  .pg { min-width: 0; border-top: 1px solid var(--line); }
  .pgh { margin: 0; font: inherit; }
  .pgbtn { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; text-align: left; background: transparent; border: 0; padding: 14px 4px; min-height: 68px; cursor: pointer; }
  .pgbtn .pt { min-width: 0; display: flex; flex-direction: column; }
  .pgbtn .pt b { font: 700 20px/1.05 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
  .pgbtn .pt span { font-size: 13px; color: var(--ink-3); }
  .pgbtn .ps { display: flex; flex-direction: column; align-items: flex-end; text-align: right; max-width: 150px; }
  .pgbtn .ps b { font: 800 26px/1 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .pgbtn .ps span { font: 500 12px/1.3 var(--font-mono); color: var(--ink-2); }
  .chev { width: 18px; height: 18px; fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
  .pgbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .pgbody { display: flex; flex-direction: column; gap: 16px; padding: 4px 4px 24px; min-width: 0; }
  .lsel { display: flex; flex-wrap: wrap; gap: 8px; }
  .lpill { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 12px; min-height: 48px; text-align: left; background: transparent; border: 1.5px solid var(--line-strong); border-radius: 10px; cursor: pointer; }
  .lpill .l1 { font-weight: 600; font-size: 14px; }
  .lpill .l2 { font-size: 12px; color: var(--ink-3); }
  .lpill[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--on-action); }
  .lpill[aria-pressed="true"] .l2 { color: var(--on-action); opacity: .8; }
  .stats.mini { gap: 10px 26px; padding-block: 12px; }
  .stats.mini .stat b { font-size: 26px; }
  .pgn { display: flex; align-items: baseline; gap: 8px 12px; flex-wrap: wrap; }
  .pgn .v { font: 800 44px/.95 var(--font-display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .pgn .u { font-weight: 600; color: var(--ink-2); }
  .delta { font: 500 13px var(--font-mono); color: var(--ink-2); }
  .pill { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 9px; border: 1px dashed var(--line-strong); border-radius: 999px; color: var(--ink-3); align-self: flex-start; }
  .sample { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1.5px dashed var(--line-strong); border-radius: 12px; }
  .recs { list-style: none; margin: 0; padding: 0; }
  .recs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding-block: 10px; border-top: 1px solid var(--line); }
  .recs li:last-child { border-bottom: 1px solid var(--line); }
  .recs .r1 { font-weight: 600; }
  .recs .r2 { font-size: 12px; color: var(--ink-3); }
  .recs .rv { font: 500 14px var(--font-mono); text-align: right; }
  .recs .rd { font-size: 12px; color: var(--ink-3); text-align: right; }
  .pwatch { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .pwatch li { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1.5px dashed var(--ink); border-radius: 10px; }

  .testrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .chart .refl { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 2 3; }
  .today { display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .thead { display: flex; align-items: center; gap: 14px; }
  .thead .disc { width: 54px; height: 54px; }
  .thead h2 { margin: 2px 0 0; font: 800 clamp(32px, 9vw, 46px)/.92 var(--font-display); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
  .today .thead .disc { width: 44px; height: 44px; }
  .today { gap: 12px !important; }
  .steps { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); margin-top: -10px; }
  .stepsec { border-top: 1px solid var(--line); gap: 0 !important; }
  .shb { width: 100%; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; align-items: center; background: none; border: 0; padding: 12px 2px; min-height: 56px; cursor: pointer; text-align: left; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; }
  .shb .ss { justify-self: end; text-align: right; font: 500 12px/1.3 var(--font-mono); color: var(--ink-3); letter-spacing: 0; text-transform: none; min-width: 0; }
  .shb[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .sn.done { background: var(--ink); color: var(--on-action); font-size: 13px; }
  .secbody { display: flex; flex-direction: column; gap: 12px; padding-bottom: 18px; min-width: 0; }
  .secbody .panel { padding: 0; }
  .workhead { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
  .workhead .n1 { font-weight: 600; font-size: 16px; }
  .workhead .n2 { font-size: 13px; color: var(--ink-3); }
  .linkrow { display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .thead p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
  .joints { display: flex; flex-wrap: wrap; gap: 6px; }
  .jchip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); }
  .days { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 2px; min-height: 58px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .day .disc { width: 20px; height: 20px; }
  .day[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); color: var(--ink); }
  .link.inline { display: inline; padding: 0; min-height: 0; font-size: inherit; }
  .donebar { margin: 0; padding: 12px 14px; border: 1.5px solid var(--ink); border-radius: 10px; font-size: 14px; }
  .stepsec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .sh { margin: 0; display: flex; align-items: center; gap: 10px; font: 700 22px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
  .sn { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-grid; place-items: center; font: 800 15px/1 var(--font-display); letter-spacing: 0; }
  .sh small { margin-left: auto; font: 500 12px var(--font-mono); color: var(--ink-3); letter-spacing: 0; text-transform: none; }

<body>

<script>
(function () {
  'use strict';

  var REP_MIN = 5, REP_MAX = 7;
  var RANGE = REP_MIN + '–' + REP_MAX;

  var PATTERNS = [
    { id: 'squat', name: 'Squat', note: 'Quads and glutes, knee-led', color: '--plate-red', lifts: ['back-squat', 'front-squat', 'split-squat', 'leg-press'] },

    { id: 'hpull', name: 'Horizontal Pull', note: 'Upper back and rear delts', color: '--plate-white', lifts: ['bb-row', 'cs-row', 'cable-row', 'one-arm-row'] },
    { id: 'vpull', name: 'Vertical Pull', note: 'Lats and biceps', color: '--plate-black', lifts: ['pullup', 'chinup', 'lat-pulldown', 'nj-pulldown'] }

    'back-squat': { name: 'Back Squat', kind: 'bb', sets: 3, inc: 5 },

    'hip-thrust': { name: 'Hip Thrust', kind: 'bb', sets: 3, inc: 10 },
    'trap-deadlift': { name: 'Trap Bar Deadlift', kind: 'tb', sets: 2, inc: 10 },
    'bench': { name: 'Barbell Bench Press', kind: 'bb', sets: 3, inc: 5 },
    'db-bench': { name: 'Dumbbell Bench Press', kind: 'db', sets: 3, inc: 5 },
    'incline-db': { name: 'Incline Dumbbell Press', kind: 'db', sets: 3, inc: 5 },
    'cg-bench': { name: 'Close-Grip Bench Press', kind: 'bb', sets: 3, inc: 5 },

    'seated-db-press': { name: 'Seated Dumbbell Press', kind: 'db', sets: 3, inc: 5 },

    'cs-row': { name: 'Chest-Supported Row', kind: 'db', sets: 3, inc: 5 },
    'cable-row': { name: 'Seated Cable Row', kind: 'mc', sets: 3, inc: 5 },
    'one-arm-row': { name: 'One-Arm Dumbbell Row', kind: 'db', sets: 3, inc: 5 },
    'pullup': { name: 'Pull-Up', kind: 'bw', sets: 3, inc: 5 },
    'chinup': { name: 'Chin-Up', kind: 'bw', sets: 3, inc: 5 },
    'lat-pulldown': { name: 'Lat Pulldown', kind: 'mc', sets: 3, inc: 5 },
    'nj-pulldown': { name: 'Neutral-Grip Pulldown', kind: 'mc', sets: 3, inc: 5 }
  };
  var KINDS = { bb: 'Barbell', tb: 'Trap bar', db: 'Dumbbells, per hand', mc: 'Machine or cable', bw: 'Bodyweight plus load', lm: 'Landmine' };

  var BAR = { lb: 45, kg: 20 };

  var LS = 'overload-log-v2';
  var PAT_OF = {};
  var DEFAULT_FOCUS = {};
  PATTERNS.forEach(function (p) { DEFAULT_FOCUS[p.id] = p.lifts[0]; p.lifts.forEach(function (id) { PAT_OF[id] = p.id; }); });

  var app = document.getElementById('app');
  var S = { unit: 'lb', focus: JSON.parse(JSON.stringify(DEFAULT_FOCUS)), rest: 180, ex: {} };
  function cleanRest(v) { return (typeof v === 'number' && isFinite(v)) ? Math.min(600, Math.max(30, Math.round(v / 15) * 15)) : 180; }
  var drafts = {};
  var tab = 'train';
  var metric = 'weight';
  var openId = null;
  var adjustOpen = false;
  var swapOpen = false;
  var manualOpen = false;
  var NOTES_LS = 'overload-log-note-drafts';

    var moved = false;
    Object.keys(noteDrafts).forEach(function (id) {
      if (S.ex[id] && typeof noteDrafts[id] === 'string' && noteDrafts[id].trim() && !S.ex[id].note) { S.ex[id].note = noteDrafts[id].slice(0, NOTE_MAX); moved = true; }
    });
    noteDrafts = {};
    try { localStorage.removeItem(NOTES_LS); } catch (err) { /* ignore */ }
    if (moved) persistLocal();
  }
  function noteBoxHTML(id) {
    return '<textarea class="exnote" id="note-' + id + '" rows="2" maxlength="' + NOTE_MAX + '" aria-label="Note for ' + LIFTS[id].name + ', kept for next time" data-note="1" data-id="' + id + '" data-k="note:' + id + '">' + esc(S.ex[id].note || '') + '</textarea>';
  }
  var dayPick = null;
  var secOpen = {};
  var histOpen = false;
  var wuListOpen = false;
  var wu = { pid: null, started: false, step: 0, done: [], t: 0, running: false };
  var ramp = {};
  var tick = null;
  var wake = null;
  var progOpen = {};
  var progSel = {};
  var col = null;
  var seeded = false;
  var synced = false;
  var queue = {};

  function fmt(n) { return String(Math.round(n * 100) / 100); }
  function rnd(x, s) { return Math.round(x / s) * s; }
  function stepW(u) { return u === 'lb' ? 5 : 2.5; }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
  function today() {
    var n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
  }
  function dateMs(s) {
    var p = String(s || '').split('-').map(Number);

  }
  function fmtT(t) { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function fmtDate(s) { var t = dateMs(s); return t ? fmtT(t) : ''; }

  function fresh(id) {
    var L = LIFTS[id];

  }
  function clean(id, d) {
    var b = fresh(id);
    if (!d || typeof d !== 'object') return b;
    function num(v, f, min, max) { return (typeof v === 'number' && isFinite(v) && v >= min && v <= max) ? v : f; }
    function lastOk(v) {
      if (v === 'hold') return 'miss';
      return (v === 'up' || v === 'reps' || v === 'miss' || v === 'down') ? v : null;
    }
    b.w = num(d.w, b.w, 0, 2000);
    b.sets = Math.round(num(d.sets, b.sets, 1, 10));
    b.inc = num(d.inc, b.inc, 0.5, 100);
    b.fails = Math.round(num(d.fails, 0, 0, 10));
    b.last = lastOk(d.last);
    b.history = Array.isArray(d.history) ? d.history.slice(-80).map(function (h) {
      h = h || {};
      var p = h.p && typeof h.p === 'object' ? { w: num(h.p.w, 0, 0, 2000), f: Math.round(num(h.p.f, 0, 0, 10)), l: lastOk(h.p.l) } : null;
      return {
        d: String(h.d || ''),
        w: num(h.w, 0, 0, 2000),
        r: Array.isArray(h.r) ? h.r.map(function (x) { return Math.round(num(x, 0, 0, 100)); }) : [],
        ok: !!h.ok,
        p: p,
        n: cleanNotes(h.n),
        note: cleanNote(h.note)
      };
    }) : [];
    if (d.base && typeof d.base === 'object') {
      b.base = { w: num(d.base.w, 0, 0, 2000), reps: typeof d.base.reps === 'number' ? Math.round(num(d.base.reps, 0, 0, 100)) : null, d: String(d.base.d || ''), manual: !!d.base.manual };
    } else if (b.history.length) {
      b.base = { w: b.w, reps: null, d: b.history[0].d, manual: true };
    }
    if (!b.base) b.w = 0;
    b.note = typeof d.note === 'string' ? d.note.slice(0, 280) : '';
    if (!b.note) {
      for (var hi = b.history.length - 1; hi >= 0; hi--) { if (b.history[hi].note) { b.note = b.history[hi].note.slice(0, 280); break; } }
    }
    b.tries = Array.isArray(d.tries) ? d.tries.slice(-12).map(function (t) { t = t || {}; return { w: num(t.w, 0, 0, 2000), r: Math.round(num(t.r, 0, 0, 100)) }; }) : [];
    return b;
  }
  function cleanFocus(f) {
    var out = JSON.parse(JSON.stringify(DEFAULT_FOCUS));
    if (f && typeof f === 'object') PATTERNS.forEach(function (p) { if (typeof f[p.id] === 'string' && PAT_OF[f[p.id]] === p.id) out[p.id] = f[p.id]; });
    return out;
  }

  Object.keys(LIFTS).forEach(function (id) { S.ex[id] = fresh(id); });
  try {
    var raw = localStorage.getItem(LS);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && (o.unit === 'lb' || o.unit === 'kg')) S.unit = o.unit;
      if (o && o.focus) S.focus = cleanFocus(o.focus);
      if (o) S.rest = cleanRest(o.rest);
      if (o && o.ex) Object.keys(LIFTS).forEach(function (id) { S.ex[id] = clean(id, o.ex[id]); });
    }
  } catch (err) { /* storage unavailable */ }
  migrateNoteDrafts();

  /* ---------- progression: double progression inside the 5 to 7 rep range ---------- */

  function deloadWeight(w) {
    var st = stepW(S.unit);
    var nw = w > 0 ? Math.max(0, rnd(w * 0.9, st)) : 0;
    if (w > 0 && nw >= w) nw = Math.max(0, w - st);
    return nw;
  }
  function outcome(e, reps) {
    var mn = Math.min.apply(null, reps);
    if (mn >= REP_MAX) return 'up';
    if (mn >= REP_MIN) return 'reps';
    return e.fails + 1 >= 2 ? 'down' : 'miss';
  }
  function cleanNotes(n) {
    if (!Array.isArray(n)) return null;
    var out = n.slice(0, 10).map(function (x) { return typeof x === 'string' ? x.trim().slice(0, 200) : ''; });
    return out.some(Boolean) ? out : null;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function cleanNote(s) { return typeof s === 'string' && s.trim() ? s.trim().slice(0, 300) : null; }
  function notesLine(n, note) {
    var parts = [];
    if (note) parts.push('<span>' + esc(note) + '</span>');
    if (n) n.forEach(function (t, i) { if (t) parts.push('<span><b>Set ' + (i + 1) + ':</b> ' + esc(t) + '</span>'); });
    return parts.length ? '<span class="nt">' + parts.join('') + '</span>' : '';
  }
  function logSession(id, reps) {
    var e = S.ex[id];
    var res = outcome(e, reps);
    e.history.push({ d: today(), w: e.w, r: reps.slice(), ok: Math.min.apply(null, reps) >= REP_MIN, p: { w: e.w, f: e.fails, l: e.last } });
    if (e.history.length > 80) e.history.shift();
    if (res === 'up') { e.w = Math.round((e.w + e.inc) * 100) / 100; e.fails = 0; }
    else if (res === 'reps') { e.fails = 0; }
    else if (res === 'down') { e.w = deloadWeight(e.w); e.fails = 0; }
    else { e.fails += 1; }
    e.last = res;
    return res;
  }
  function undoLast(id) {
    var e = S.ex[id];
    var h = e.history.pop();
    if (!h) return;
    if (h.p) { e.w = h.p.w; e.fails = h.p.f; e.last = h.p.l; } else { e.w = h.w; }
  }
  function getDraft(id) {
    var e = S.ex[id];
    var d = drafts[id];
    if (!d || d.length !== e.sets) { d = []; for (var i = 0; i < e.sets; i++) d.push(null); drafts[id] = d; }
    return d;
  }

  /* ---------- baseline test: find the weight that lands in the range ---------- */

  function startWeight(w) {
    var st = stepW(S.unit);
    if (w <= 0) return 0;
    var sw = Math.max(0, rnd(w * 0.9, st));
    if (sw >= w) sw = Math.max(0, w - st);

    if (LIFTS[id].kind === 'bw') {
      if (r > REP_MAX) return Math.round((w + st * Math.max(1, Math.ceil((r - REP_MAX) / 2))) * 100) / 100;
      if (w <= 0) return null;

    }

    f = Math.min(1.3, Math.max(0.6, f));
    nw = rnd(w * f, st);
    if (r > REP_MAX && nw <= w) nw = w + st;
    if (r < REP_MIN && nw >= w) nw = Math.max(0, w - st);
    return nw;
  }
  function recordTry(id, w, r) {
    var e = S.ex[id];
    if (r >= REP_MIN && r <= REP_MAX) {
      e.base = { w: w, reps: r, d: today(), manual: false };
      e.tries = [];
      e.w = startWeight(w);
      e.fails = 0;
      e.last = null;
      return 'ok';

    e.tries.push({ w: w, r: r });
    if (e.tries.length > 12) e.tries.shift();

  }
  function useManual(id, w) {
    var e = S.ex[id];
    e.base = { w: w, reps: null, d: today(), manual: true };
    e.tries = [];
    e.w = w;
    e.fails = 0;
    e.last = null;
  }

  /* ---------- strength tracking: working weight and reps inside the range ---------- */

  function seriesOf(id) {
    var bestW = -1, bestT = -1, maxOk = -1;

      var n = h.r.length, total = sum(h.r), mn = n ? Math.min.apply(null, h.r) : 0;
      var ok = n > 0 && mn >= REP_MIN, top = n > 0 && mn >= REP_MAX;

    });

  function plateau(id) {

  function bestQualified(id) {

    if (two.length) return latest(two);

  }
  function liftHead(id) {
    var s = seriesOf(id);

  }

  function convertUnit(to) {
    if (to === S.unit) return;

    var sw = to === 'lb' ? 5 : 2.5;
    var si = to === 'lb' ? 2.5 : 1.25;

  /* ---------- storage ---------- */

  function persistLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (err) { /* ignore */ } }
  function save(id) {

  /* ---------- charts ---------- */

  function drawChart(list, opt) {
    opt = opt || {};

    if (!all.length) return '';

    if (opt.band) out += '<rect class="band" x="' + L + '" width="' + (W - L - R) + '" y="' + y(opt.band[1]).toFixed(1) + '" height="' + (y(opt.band[0]) - y(opt.band[1])).toFixed(1) + '"/>';

    });
    if (opt.ref) {

    var ordered = list.filter(function (s) { return !s.focus; }).concat(list.filter(function (s) { return s.focus; }));
    ordered.forEach(function (s) {

    var lb = lastBackup();
    var confirmBar = pendingImport ?
      '<div class="confirm" role="group" aria-label="Confirm import"><span>Replace everything on this phone with the backup from <b>' + (pendingImport.when ? fmtDate(pendingImport.when.slice(0, 10)) : 'an unknown date') + '</b> (' + pendingImport.sessions + ' logged sessions)? This cannot be undone.</span>' +
      '<div class="acts"><button type="button" class="btn small" data-act="importyes" data-k="importyes">Replace my log</button><button type="button" class="btn ghost small" data-act="importno" data-k="importno">Cancel</button></div></div>' : '';
    return '<div class="backup">' +
      '<p class="foot">Saved on this phone only' + (swReady ? ' and ready to use offline' : '') + '. Export a backup now and then so a lost or reset phone keeps your history. Last backup: ' + (lb ? fmtDate(lb) : 'never') + '.</p>' +
      '<div class="linkrow"><button type="button" class="link" data-act="export" data-k="export">Export backup</button><button type="button" class="link" data-act="importpick" data-k="importpick">Import backup</button>' +
      '<input type="file" id="import-file" accept="application/json,.json" hidden></div>' + confirmBar +
      '<p class="foot">Plate math assumes a ' + BAR.lb + ' lb or ' + BAR.kg + ' kg bar.</p></div>';
  }
  function exportData() {
    var name = 'overload-log-backup-' + today() + '.json';
    var data = JSON.stringify({ app: 'overload-log', version: 1, exported: new Date().toISOString(), state: S });
    var blob = new Blob([data], { type: 'application/json' });
    function mark() { try { localStorage.setItem(LAST_BACKUP, today()); } catch (err) { /* ignore */ } render(); }
    try {
      var file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        navigator.share({ files: [file], title: 'Overload Log backup' }).then(function () { mark(); toast('Backup shared. Save it to Files, Drive or email it to yourself.'); }).catch(function (err) {
          if (err && err.name === 'AbortError') return;
          download();
        });
        return;
      }
    } catch (err) { /* fall through to download */ }
    download();
    function download() {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      mark();
      toast('Backup saved as ' + name + '.');
    }
  }
  function readImport(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result);
        var st = o && o.state ? o.state : o;
        if (!st || typeof st !== 'object' || !st.ex || typeof st.ex !== 'object') throw new Error('shape');
        var n = 0;
        Object.keys(LIFTS).forEach(function (id) { var x = st.ex[id]; if (x && Array.isArray(x.history)) n += x.history.length; });
        pendingImport = { state: st, when: o.exported || '', sessions: n };
        render();
      } catch (err) {
        toast('That file is not an Overload Log backup. Choose a file exported from this app.');
      }
    };
    fr.onerror = function () { toast('Could not read that file. Try choosing it again.'); };
    fr.readAsText(file);
  }
  function applyImport() {
    var st = pendingImport.state;
    S.unit = st.unit === 'kg' ? 'kg' : 'lb';
    S.focus = cleanFocus(st.focus);
    S.rest = cleanRest(st.rest);
    Object.keys(LIFTS).forEach(function (id) { S.ex[id] = clean(id, st.ex[id]); });
    pendingImport = null;
    drafts = {};
    secOpen = {};
    persistLocal();
    render();
    toast('Backup restored.');
  }
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    if (act === 'export') exportData();
    else if (act === 'importpick') { var inp = document.getElementById('import-file'); if (inp) { inp.value = ''; inp.click(); } }
    else if (act === 'importyes' && pendingImport) applyImport();
    else if (act === 'importno') { pendingImport = null; render(); }
  });
  app.addEventListener('change', function (ev) {
    if (ev.target && ev.target.id === 'import-file' && ev.target.files && ev.target.files[0]) readImport(ev.target.files[0]);
  });

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (err) { /* ignore */ }
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline support unavailable */ });
    });
    navigator.serviceWorker.ready.then(function () { swReady = true; render(); });
  }

  render();
})();
</script>
</body>
</html>
